<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Room — NK-Dev ClassRoom</title>
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#4c7a5c" />
  <link rel="icon" href="/assets/icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/styles/main.css" />
</head>
<body>
  <header class="topbar">
    <div class="container">
      <a class="brand" href="/dashboard.html">
        <img src="/assets/icons/icon-192.png" alt="Logo NK-Dev ClassRoom" />
        NK-Dev ClassRoom
      </a>
      <div class="row gap-2">
        <button class="btn btn-outline btn-sm" id="btn-toggle-sidebar" style="display:none;">Anggota</button>
        <a class="btn btn-outline btn-sm" href="/dashboard.html">Kembali</a>
      </div>
    </div>
  </header>

  <div id="locked-banner" class="locked-banner" style="display:none;"></div>

  <div class="room-shell">
    <aside class="room-sidebar" id="room-sidebar">
      <h3 id="sidebar-room-name" style="font-size: 16px;"></h3>
      <p class="hint" id="sidebar-room-time" style="font-size: 12px; margin-bottom: 16px;"></p>

      <div id="admin-panel" style="display:none;">
        <h4 style="font-size: 13px; text-transform: none; margin-bottom: 8px;">Menunggu persetujuan</h4>
        <div id="pending-list" style="margin-bottom: 20px;"></div>
      </div>

      <h4 style="font-size: 13px; margin-bottom: 8px;">Anggota</h4>
      <ul class="member-list" id="member-list"></ul>
    </aside>

    <section class="chat-area">
      <div class="chat-messages" id="chat-messages"></div>
      <form class="chat-composer" id="chat-form">
        <label class="btn btn-outline btn-sm" style="cursor:pointer;">
          📎
          <input type="file" id="chat-image" accept="image/*" style="display:none;" />
        </label>
        <input type="text" id="chat-text" placeholder="Tulis pesan atau tempel link Google Drive..." autocomplete="off" />
        <button type="submit" class="btn btn-primary">Kirim</button>
      </form>
    </section>
  </div>

  <div id="toast"></div>

  <script type="module" src="/src/scripts/room.js"></script>
  <script src="/src/scripts/pwa-register.js"></script>
</body>
</html>
